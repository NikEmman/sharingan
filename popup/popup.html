<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <label for="session">Session folder</label>
    <input id="session" type="text" spellcheck="false" />

    <label for="note">Note for this step (optional)</label>
    <input id="note" type="text" placeholder="e.g. typed 2516, clicked row 2516/10" />

    <label class="check"><input id="embed-css" type="checkbox" checked /> Embed stylesheets (page displays offline)</label>

    <div id="step"></div>
    <button id="copy">Sharingan!</button>
    <div id="status"></div>

    <div class="row">
      <button id="log" class="small">Download steps.txt</button>
      <button id="new-session" class="small">New session</button>
    </div>
  </body>
</html>
